name: Build & Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install deps
        run: pip install feedparser beautifulsoup4 flask httpx pyinstaller

      - name: Debug - check Python
        run: |
          python --version
          pip list 2>/dev/null | grep -i pyinstaller
          dir /s /b src\templates 2>nul || ls -la src/templates/
        shell: bash

      - name: Create key file
        env:
          KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python -c "import os; open('src/_secret.py','w').write('DEEPSEEK_API_KEY = ' + repr(os.environ['KEY']))"

      - name: Build
        run: python -m PyInstaller --onedir --console --name=news-collector --add-data "src/templates;src/templates" --add-data "src/static;src/static" --hidden-import=src.collector --hidden-import=src.crawler --hidden-import=src.summarizer --hidden-import=src.config --hidden-import=src.models --hidden-import=src.sources --hidden-import=src._secret --noconfirm --clean src/__main__.py 2>&1

      - name: Check output
        run: ls -la dist/news-collector/ && ls -la dist/news-collector/news-collector.exe

      - name: Create ZIP
        run: |
          cd dist
          zip -r news-collector.zip news-collector/
        shell: bash

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/news-collector.zip
          name: 简简单单的新闻 ${{ github.ref_name }}
          body: |
            简简单单的新闻

            Windows 版本，下载解压后双击 news-collector.exe 即可使用。

            功能:
            - 每日自动采集 7 家国内主流媒体新闻
            - 要点总结（AI 生成）
            - 爬取全文保存为文件
            - 收藏 / 已读标记 / 搜索 / 筛选
