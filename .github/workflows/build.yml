name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Create _secret.py with API key
        run: |
          echo '# auto-generated' > src\_secret.py
          echo 'DEEPSEEK_API_KEY = """' >> src\_secret.py
          echo '${{ secrets.DEEPSEEK_API_KEY }}' >> src\_secret.py
          echo '"""' >> src\_secret.py
        shell: bash

      - name: Build with PyInstaller
        run: python -m PyInstaller --onedir --console --name=news-collector --add-data "src/templates;src/templates" --add-data "src/static;src/static" --noconfirm src/__main__.py
        shell: bash

      - name: Verify output
        run: ls -la dist/news-collector/

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/news-collector/**
          name: 简简单单的新闻 ${{ github.ref_name }}
          body: |
            简简单单的新闻

            Windows 版本，下载解压后双击 news-collector.exe 即可使用。

            功能:
            - 每日自动采集 7 家国内主流媒体新闻
            - 要点总结（AI 生成）
            - 爬取全文保存为文件
            - 收藏 / 已读标记 / 搜索 / 筛选
