<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>简简单单的新闻</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-left">
      <h1 class="logo">简简单单的新闻</h1>
      <span class="logo-dot">·</span>
      <span class="logo-sub">每日简讯</span>
    </div>
    <div class="topbar-right">
      <span class="stat-badge" id="statsBar"></span>
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="7"/><path d="M15 15l6 6"/></svg>
        <input type="text" id="searchInput" placeholder="搜索新闻…" oninput="debouncedSearch()">
      </div>
      <button class="btn btn-primary" onclick="refreshNews()" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
        刷新
      </button>
      <button class="btn btn-theme" onclick="toggleTheme()" id="themeBtn" title="切换主题">
        <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </div>
</header>

<!-- 采集进度条 -->
<div id="progressBar" class="progress-bar" style="display:none">
  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  <span class="progress-text" id="progressText">正在获取…</span>
</div>

<!-- 筛选栏 -->
<section class="filters">
  <div class="filters-row">
    <div class="filter-chip-group" id="categoryFilters">
      <button class="chip active" data-category="">全部</button>
    </div>
    <div class="filter-controls">
      <div class="filter-select">
        <select id="sourceFilter" onchange="applyFilters()">
          <option value="">全部来源</option>
        </select>
      </div>
      <div class="filter-select">
        <input type="date" id="dateFilter" onchange="applyFilters()">
      </div>
    </div>
  </div>
  <div class="filters-row filters-row-secondary">
    <div class="filter-chip-group" id="readFilters">
      <button class="chip active" data-read="">全部</button>
      <button class="chip" data-read="unread">未读</button>
      <button class="chip" data-read="read">已读</button>
    </div>
    <div class="filter-controls">
      <label class="toggle-label" id="bookmarkWrap">
        <input type="checkbox" id="bookmarkFilter" onchange="applyFilters()">
        <span class="toggle-star">☆</span>
        <span>仅收藏</span>
      </label>
    </div>
  </div>
</section>

<!-- 新闻列表 -->
<main id="newsList" class="news-list">
  <div class="loading">加载中…</div>
</main>

<!-- 底部 -->
<footer class="footer" id="footer"></footer>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="/static/script.js"></script>
</body>
</html>
